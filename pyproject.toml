[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-dbscan"
version = "0.1.0"
description = "Device-sensitive DBSCAN for 2D LiDAR scans via a closed-form radial coordinate warp."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hernan Vinicio Lopez Morocho" }]
keywords = ["DBSCAN", "clustering", "2D LiDAR", "mobile robotics", "scikit-learn"]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "pandas>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
ds-dbscan = "ds_dbscan.cli:main"

[tool.setuptools]
packages = ["ds_dbscan"]
